<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <radialGradient id="bg" cx="70%" cy="22%" r="100%">
      <stop offset="0" stop-color="#242a3d"/>
      <stop offset="0.5" stop-color="#151925"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </radialGradient>
    <radialGradient id="moon" cx="70%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ecfca0"/>
      <stop offset="1" stop-color="#cfea5c"/>
    </radialGradient>
    <radialGradient id="disc" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1c1f2c"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.45" stop-color="#d8f26a" stop-opacity="0"/>
      <stop offset="1" stop-color="#d8f26a" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="disc-clip"><circle cx="490" cy="534" r="252"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>
  <!-- scripts/generate-icons.mjs drops this clip to get the full-bleed icon -->
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- moon behind the record -->
    <circle cx="552" cy="472" r="252" fill="#d8f26a" opacity="0.35" filter="url(#glow)"/>
    <circle cx="552" cy="472" r="252" fill="url(#moon)"/>
    <!-- record eclipsing the moon -->
    <circle cx="490" cy="534" r="252" fill="url(#disc)"/>
    <g clip-path="url(#disc-clip)" fill="none" stroke="#fff">
      <circle cx="490" cy="534" r="226" stroke-opacity="0.06" stroke-width="3"/>
      <circle cx="490" cy="534" r="200" stroke-opacity="0.05" stroke-width="3"/>
      <circle cx="490" cy="534" r="174" stroke-opacity="0.06" stroke-width="3"/>
      <circle cx="490" cy="534" r="148" stroke-opacity="0.05" stroke-width="3"/>
      <circle cx="490" cy="534" r="122" stroke-opacity="0.06" stroke-width="3"/>
      <path d="M490 534 L700 330 A292 292 0 0 1 760 420 Z" fill="url(#sheen)" stroke="none"/>
      <path d="M490 534 L280 738 A292 292 0 0 1 220 648 Z" fill="url(#sheen)" stroke="none"/>
    </g>
    <circle cx="490" cy="534" r="251" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="490" cy="534" r="250" fill="none" stroke="url(#rim)" stroke-width="4"/>
    <!-- label -->
    <circle cx="490" cy="534" r="72" fill="#d8f26a"/>
    <circle cx="490" cy="534" r="58" fill="none" stroke="#101116" stroke-opacity="0.18" stroke-width="3"/>
    <circle cx="490" cy="534" r="13" fill="#0c0d12"/>
  </g>
</svg>
